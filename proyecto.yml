# Datos del proyecto. Es el único archivo de datos que llenás a mano; después: ./pj
# Lo valida schema/proyecto.schema.json de pj-template. Los textos van entre comillas (un # sin comillas corta el valor).
proyecto: "HR-GIT-SETUP"       # nombre del trío: PM-HR-GIT-SETUP, WK-HR-GIT-SETUP, RV-HR-GIT-SETUP
area: "gestión y estandarización de las herramientas públicas de Roberto empaquetadas para Arch (nombres, CI y publicación), incluyendo git-setup y git-setup.nvim"
rama_base: "main"              # rama de los PR finales
template_ref: "add0cfd9cc85f1f067e057792d4b588d2d26c0fd"   # SHA de robert-flo/pj-template; lo sube el PR de sync
# Repos hijos (vacío en proyectos de un solo repo). dir = carpeta local, ignorada en .gitignore.
repos:
  - dir: "pj-domina-rf-git-setup"
    repo: "robert-flo/pj-domina-rf-git-setup"
    rama: "master"
    nota: "CLI git-setup"
  - dir: "rvim"
    repo: "robert-flo/rvim"
    rama: "main"
    nota: "Configuración de Neovim de Roberto"
  - dir: "pj-domina-rf-git-setup-arch"
    repo: "robert-flo/pj-domina-rf-git-setup-arch"
    rama: "master"
    nota: "Empaquetado Arch de la CLI git-setup"
  - dir: "pj-domina-rf-git-setup.nvim"
    repo: "robert-flo/pj-domina-rf-git-setup.nvim"
    rama: "master"
    nota: "Plugin de Neovim compañero de git-setup"
  - dir: "octohub.nvim"
    repo: "2KAbhishek/octohub.nvim"
    rama: "main"
    nota: "Referencia externa de solo lectura (sin push a upstream ni PRs)"
  - dir: "pj-domina-rf-shared_dir"
    repo: "robert-flo/pj-domina-rf-shared_dir"
    rama: "master"
    nota: "Herramienta compartida shared_dir"
  - dir: "pj-domina-rf-shared_dir-arch"
    repo: "robert-flo/pj-domina-rf-shared_dir-arch"
    rama: "master"
    nota: "Empaquetado Arch de shared_dir"
  - dir: "ravn-git-bare-clone"
    repo: "robert-flo/ravn-git-bare-clone"
    rama: "main"
    nota: "Launcher y runtime modular de ravn-git-bare-clone"
  - dir: "ravn-git-bare-clone-arch"
    repo: "robert-flo/ravn-git-bare-clone-arch"
    rama: "main"
    nota: "Paquete Arch Linux para ravn-git-bare-clone"
  - dir: "ravn-sessionizer"
    repo: "robert-flo/ravn-sessionizer"
    rama: "main"
    nota: "Sessionizer para herdr"
  - dir: "ravn-sessionizer-arch"
    repo: "robert-flo/ravn-sessionizer-arch"
    rama: "main"
    nota: "Paquete Arch de ravn-sessionizer"
  - dir: "ravn-trio"
    repo: "robert-flo/ravn-trio"
    rama: "main"
    nota: "Trío PM/WK/RV local en herdr (pj-trio)"
  - dir: "ravn-trio-arch"
    repo: "robert-flo/ravn-trio-arch"
    rama: "main"
    nota: "Paquete Arch de ravn-trio"
  - dir: "ravn-home-common"
    repo: "robert-flo/ravn-home-common"
    rama: "main"
    nota: "Capa común de $HOME para la workstation ravn"
  - dir: "ravn-home-common-arch"
    repo: "robert-flo/ravn-home-common-arch"
    rama: "main"
    nota: "PKGBUILD Arch Linux para ravn-home-common"
  - dir: "ravn-home-niri"
    repo: "robert-flo/ravn-home-niri"
    rama: "main"
    nota: "Capa niri para la workstation ravn"
  - dir: "ravn-home-niri-arch"
    repo: "robert-flo/ravn-home-niri-arch"
    rama: "main"
    nota: "PKGBUILD y empaquetado Arch Linux para ravn-home-niri"
  - dir: "ravn-webapps"
    repo: "robert-flo/ravn-webapps"
    rama: "master"
    nota: "Launchers .desktop, íconos y runtime para webapps en RaVN"
  - dir: "ravn-webapps-arch"
    repo: "robert-flo/ravn-webapps-arch"
    rama: "master"
    nota: "Empaquetado Arch y release automation para ravn-webapps"
  - dir: "scratchpad"
    repo: "robert-flo/scratchpad"
    rama: "main"
    nota: "Documentación canónica de arquitectura, runbooks y design logs del fork personal de Omarchy"
  - dir: "omarchy-personal-archive-2026-09"
    repo: "robert-flo/omarchy-personal-archive-2026-09"
    rama: "personal"
    nota: "Archivo histórico del fork personal de Omarchy y quattro (previo a sept 2026)"
  - dir: "omarchy-pkgs"
    repo: "robert-flo/omarchy-pkgs"
    rama: "personal"
    nota: "Paquetes del fork personal de Omarchy (-arch / -aur)"
  - dir: "omarchy"
    repo: "robert-flo/omarchy"
    rama: "personal"
    nota: "Fork personal de Omarchy"
  - dir: "pj-omarchy"
    repo: "robert-flo/pj-omarchy"
    rama: "main"
    nota: "Meta-repositorio y orquestador del workspace pj-omarchy"
  - dir: "omarchy-personal-repo"
    repo: "robert-flo/omarchy-personal-repo"
    rama: "main"
    nota: "Repositorio personal de pacman alojado en GitHub Pages"
# Specs en curso: ref = dueño/repo#N, orden entero, exactamente uno con primero: true.
specs: []
notas: |
  Meta-repo HR-GIT-SETUP para gestionar y estandarizar las herramientas públicas de Roberto
  empaquetadas para Arch (nombres, CI y estrategias de publicación entre todos los dúos fuente
  + *-arch), incluyendo el ecosistema de git-setup y git-setup.nvim. También integra los repos
  de infraestructura y estrategia de publicación de paquetes -arch / -aur y el repositorio
  personal de pacman (Omarchy y omarchy-personal-repo). El código del plugin vive en
  pj-domina-rf-git-setup.nvim; la mini terminal lanza el comando git-pull de la CLI git-setup
  (pj-domina-rf-git-setup), cuyo empaquetado Arch vive en pj-domina-rf-git-setup-arch. rvim es
  la configuración de Neovim de Roberto. 2KAbhishek/octohub.nvim es una referencia externa de
  solo lectura: nunca hacer push a upstream ni abrir PRs.
# Skills extra por rol, además de plantillas/roles.yml de pj-template.
skills_extra: {}
