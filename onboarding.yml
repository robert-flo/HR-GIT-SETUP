# Onboarding del trío de HR-GIT-SETUP: lo propio del proyecto que reciben PM, WK y RV en su ficha.
# Lo escribe `./pj onboard` (entrevista); se puede editar a mano y correr `./pj`.
# hecho vacío = onboarding sin hacer. Esquema: schema/onboarding.schema.json de pj-template.
version: 1
hecho: "2026-11-18"
mision: "Gestionar y estandarizar todas las herramientas públicas de Roberto empaquetadas para Arch (nombres, CI y estrategias de publicación en sus dúos fuente + *-arch), incluyendo el ecosistema de git-setup y su plugin de Neovim git-setup.nvim."
no_tocar:
  - "2KAbhishek/octohub.nvim (repos/octohub.nvim): referencia externa de solo lectura; nunca hacer push a upstream ni abrir PRs"
reglas_proyecto:
  - "Cada herramienta pública empaquetada para Arch se gestiona como un dúo (repositorio fuente + repositorio *-arch) con convenciones consistentes de nombres, CI y publicación"
  - "El código del plugin vive en pj-domina-rf-git-setup.nvim; la mini terminal lanza el comando git-pull de la CLI git-setup (pj-domina-rf-git-setup), cuyo empaquetado Arch vive en pj-domina-rf-git-setup-arch"
  - "rvim es la configuración de Neovim de Roberto donde se integra y prueba el plugin"
  - "octohub.nvim es solo referencia de lectura para patrones y estructura de plugins de Neovim"
primeros_pasos:
  - "leer README.md y AGENTS.md de este meta-repo y de los repos del proyecto"
  - "revisar los issues abiertos de cada repo (gh issue list) y proponer por cuál empezar"
wk:
  como_probar:
    - "en el meta-repo: ./pj check da «todo bien»"
    - "cada criterio de aceptación con su prueba corrida de verdad en esta máquina y la salida o captura en el PR"
rv:
  exige:
    - "que lo de «cómo prueba el WK» esté corrido de verdad en el PR; si no, BLOQUEO"
